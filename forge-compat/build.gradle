plugins {
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

mixin { // 绑定Mixin编译阶段的refmap
    add sourceSets.main, "customgun.refmap.json"
}
// 合并core模块的资源与编译逻辑链到当前模块的主流水线
sourceSets.main.java.srcDirs += project(':core').sourceSets.main.java.srcDirs // 会额外编译一次core

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    from(project(':core').sourceSets.main.resources)

    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            loader_version_range   : forge_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_credits            : mod_credits,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_issue_url          : mod_issue_url,
            mod_display_url        : mod_display_url,
            mod_logo_file          : mod_logo_file,
            pack_description       : pack_description,
            pack_format            : pack_format,

            target_modloader       : forge_id,
            target_version_range   : forge_version_range
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation project(":core")

    // MixinExtras (仅Forge需要打包)
    implementation "${mixin_extras_common}:${mixin_extras_version}"
    implementation "${mixin_extras_forge}:${mixin_extras_version}"
    jarJar(implementation("${mixin_extras_forge}:${mixin_extras_version}")) {
        jarJar.ranged(it, "[${mixin_extras_version},)")
    }
    annotationProcessor "${mixin_annotation}"
    annotationProcessor "${mixin_extras_annotation}:${mixin_extras_version}"

    // LuaJ
    minecraftLibrary(jarJar("${luaj_figuramc_core}")) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
        jarJar.ranged(it, "[${luaj_figuramc_version},)")
    }
    minecraftLibrary(jarJar("${luaj_figuramc_jse}")) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
        jarJar.ranged(it, "[${luaj_figuramc_version},)")
    }
    minecraftLibrary(jarJar("${luaj_bcel}")) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
        jarJar.ranged(it, "[${luaj_bcel_version},)")
    }
}

tasks.named('jar', Jar).configure {
    archiveBaseName.set(mod_id)
    archiveVersion.set(mod_version)
//    archiveClassifier.set("${forge_id}-${minecraft_version}") // jarJar机制的影响
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':core').sourceSets.main.output

    manifest {
        attributes([
                "Implementation-Title"    : mod_name,
                "Implementation-Version"  : mod_version,
                "MixinConfigs"            : mixin_config_file + "," + mixin_config_file_forge
        ])
    }
}

tasks.matching { it.name == 'remapJar' || it.name == 'reobfJar' }.configureEach {
    if (it.hasProperty("archiveClassifier")) {
        it.archiveBaseName.set(mod_id)
        it.archiveVersion.set(mod_version)
        it.archiveClassifier.set("${forge_id}-${minecraft_version}")
    }
}
// jarJar机制
tasks.matching { it.name == 'jarJar' || it.name == 'reobfJarJar' }.configureEach {
    if (it.hasProperty("archiveClassifier")) {
        it.archiveBaseName.set(mod_id)
        it.archiveVersion.set(mod_version)
        it.archiveClassifier.set("${forge_id}-${minecraft_version}")
    }
}
