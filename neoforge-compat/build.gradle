plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.21'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    clientData {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

tasks.withType(ProcessResources).configureEach {
    from(project(':core').sourceSets.main.resources)

    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            loader_version_range   : neo_loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_credits            : mod_credits,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_issue_url          : mod_issue_url,
            mod_display_url        : mod_display_url,
            mod_logo_file          : mod_logo_file,
            pack_description       : pack_description,
            pack_format            : pack_format,

            target_modloader       : neoforge_id,
            target_version_range   : neo_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    implementation project(":core")

    // LuaJ
    jarJar("${luaj_figuramc_core}") {
        jarJar.ranged(it, "[${luaj_figuramc_version},)")
    }
    jarJar("${luaj_figuramc_jse}") {
        jarJar.ranged(it, "[${luaj_figuramc_version},)")
    }
    jarJar("${luaj_bcel}") {
        jarJar.ranged(it, "[${luaj_bcel_version},)")
    }
}

tasks.named('jar', Jar).configure {
    archiveBaseName.set(mod_id)
    archiveVersion.set(mod_version)
//    archiveClassifier.set("${neoforge_id}-${minecraft_support_version}") // jarJar机制的影响
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(':core').sourceSets.main.output

//    manifest {
//        attributes([
//                "Implementation-Title"    : mod_name,
//                "Implementation-Version"  : mod_version,
//                "MixinConfigs"            : mixin_config_file
//        ])
//    }
}

// jarJar机制
tasks.matching { it.name == 'jarJar' || it.name == 'reobfJarJar' }.configureEach {
    if (it.hasProperty("archiveClassifier")) {
        it.archiveBaseName.set(mod_id)
        it.archiveVersion.set(mod_version)
        it.archiveClassifier.set("${neoforge_id}-${minecraft_support_version}")
    }
}